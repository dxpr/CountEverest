<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- Don't forget to change the title! -->
		<title>Theme 10 - Count Everest jQuery Plugin</title>

		<!-- Load Google Fonts -->
		<link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto:400">
		<link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Unica+One">

		<!-- Load stylesheet -->
		<link rel="stylesheet" href="css/counteverest.dxpr.css">

		<!-- DEMO styles to center countdown vertically and horizontally -->
		<style type="text/css">
			html {
				display: table;
				height: 100%;
				width: 100%;
			}

			body {
				background: #eee;
				display: table-cell;
				margin: 0;
				padding: 0;
				text-align: center;
				vertical-align: middle;
			}

			.ce-countdown {
				margin: 0 auto;
				max-width: 800px;
				text-align: center;
			}
		</style>
	</head>
	<body>

		<!-- Nothing to change here -->
		<div class="ce-countdown ce-countdown--theme-10">
			<div class="ce-unit-wrap">
				<div class="ce-days"></div>
				<span class="ce-days-label"></span>
			</div>
			<div class="ce-unit-wrap">
				<div class="ce-hours"></div>
				<span class="ce-hours-label"></span>
			</div>
			<div class="ce-unit-wrap">
				<div class="ce-minutes"></div>
				<span class="ce-minutes-label"></span>
			</div>
			<div class="ce-unit-wrap">
				<div class="ce-seconds"></div>
				<span class="ce-seconds-label"></span>
			</div>
		</div>

		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const countdownElement = document.querySelector('.ce-countdown');
				if (countdownElement) {
					let firstCalculation = true;
					new CountEverest(countdownElement, {
						day: 30,
						month: 6,
						year: 2026,
						leftHandZeros: true,
						afterCalculation: function() {
							const units = {
								days: this.days,
								hours: this.hours,
								minutes: this.minutes,
								seconds: this.seconds
							};
							const maxValues = {
								hours: '23',
								minutes: '59',
								seconds: '59'
							};
							const actClass = 'active';
							const befClass = 'before';

							if (firstCalculation) {
								firstCalculation = false;
								countdownElement.querySelectorAll('.ce-unit-wrap div').forEach(function(el) {
									const className = el.className;
									const value = units[className];
									let sub = '';
									let dig = '';

									if (typeof maxValues[className] !== 'undefined') {
										dig = maxValues[className];
									} else {
										dig = value;
									}

									for (let i = 0; i < dig.length; i++) {
										sub += '<span>' + dig.substr(i, 1) + '</span>';
									}

									el.innerHTML = sub;
								});
							}

							countdownElement.querySelectorAll('.ce-unit-wrap div').forEach(function(el) {
								const value = units[el.className];
								const children = el.children;

								for (let i = 0; i < children.length; i++) {
									const digit = value.toString().substr(i, 1);

									children[i].classList.remove(actClass);
									children[i].classList.remove(befClass);

									if (digit === children[i].textContent) {
										children[i].classList.add(actClass);
									} else if (children[i].textContent < digit) {
										children[i].classList.add(befClass);
									}
								}
							});
						}
					});
				}
			});
		</script>
	</body>
</html>
